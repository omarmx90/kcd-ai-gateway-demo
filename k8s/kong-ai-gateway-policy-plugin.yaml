# Single pre-function: Kong rejects two `pre-function` plugins on the same Ingress route.
# Merges former cost-router + pii-sanitizer (order: cost routing, then PII — same as before).
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: ai-gateway-policy
  namespace: ai-gateway-demo
plugin: pre-function
config:
  access:
    - |
      local function cost_router()
        local method = kong.request.get_method()
        if method ~= "POST" then return end
        local path = kong.request.get_path()
        if not string.match(path or "", "^/ai/") then return end
        local ct = (kong.request.get_header("content-type") or ""):lower()
        if not string.find(ct, "application/json", 1, true) then return end

        local pri = (kong.request.get_header("x-priority") or ""):lower()
        if pri == "low" then
          kong.service.request.set_header("X-Cost-Route", "local")
          return
        end
        if pri == "high" then
          kong.service.request.set_header("X-Cost-Route", "cloud")
          return
        end

        local body, err = kong.request.get_body()
        if err or type(body) ~= "table" or not body.text then
          kong.service.request.set_header("X-Cost-Route", "cloud")
          return
        end
        local text = tostring(body.text)
        local len = string.len(text)
        local threshold = 200
        if len < threshold then
          kong.service.request.set_header("X-Cost-Route", "local")
        else
          kong.service.request.set_header("X-Cost-Route", "cloud")
        end
      end

      local function pii_sanitize()
        local method = kong.request.get_method()
        if method ~= "POST" then return end
        local path = kong.request.get_path()
        if not string.match(path or "", "^/ai/") then return end
        local ct = (kong.request.get_header("content-type") or ""):lower()
        if not string.find(ct, "application/json", 1, true) then return end

        local body, err = kong.request.get_body()
        if err or type(body) ~= "table" then return end
        if not body.text then
          kong.service.request.set_header("X-PII-REDACTIONS", "0")
          return
        end

        local text = tostring(body.text)
        local card = ngx.re.match(text, [[(?:\d{4}[-\s]?){3}\d{4}]], "jo")
        if card then
          return kong.response.exit(403,
            '{"error":"request_blocked","reason":"payment_number_pattern","detail":"Gateway policy: card-like sequence not allowed toward cloud LLMs"}',
            {["Content-Type"] = "application/json; charset=utf-8"})
        end

        local redactions = 0
        local function re_redact(pcre, replacement)
          local new_text, n, err = ngx.re.gsub(text, pcre, replacement, "jo")
          if not err and n and n > 0 then
            text = new_text
            redactions = redactions + n
          end
        end
        re_redact([[([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]+)]], "[REDACTED_EMAIL]")
        re_redact([[(\+?\d[\d\-\s\(\)]\d\d\d[\d\-\s\(\)]\d\d\d\d)]], "[REDACTED_PHONE]")
        re_redact([[([0-9]{3}-[0-9]{2}-[0-9]{4})]], "[REDACTED_SSN]")

        if redactions > 0 then
          body.text = text
          kong.service.request.set_body(body)
          kong.service.request.set_header("X-PII-REDACTIONS", tostring(redactions))
          kong.service.request.set_header("X-PII-REDACTED", "true")
        else
          kong.service.request.set_header("X-PII-REDACTIONS", "0")
        end
      end

      local ok, err = pcall(function()
        cost_router()
        pii_sanitize()
      end)
      if not ok then
        kong.log.err("ai-gateway-policy error: ", err)
      end
