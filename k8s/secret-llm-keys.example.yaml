# Prefer creating the Secret from your shell (no keys on disk):
#   export OPENAI_API_KEY="sk-..."
#   export GOOGLE_API_KEY="..."   # Gemini; or GEMINI_API_KEY
#   ./scripts/create-llm-secret-from-env.sh
#
# Alternative: copy this file to secret-llm-keys.local.yaml (gitignored), edit, then kubectl apply.
#
# Keys:
#   - openai-api-key: https://platform.openai.com/api-keys
#   - google-api-key: https://aistudio.google.com/apikey (Gemini)
apiVersion: v1
kind: Secret
metadata:
  name: ai-llm-credentials
  namespace: ai-gateway-demo
type: Opaque
stringData:
  openai-api-key: "sk-replace-me"
  google-api-key: "replace-me"
