apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-gateway
  namespace: ai-gateway-demo
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: "rate-limit-by-app,ai-gateway-policy"
spec:
  ingressClassName: kong
  rules:
    # Browsers send Host: ai-gateway.local when you open http://ai-gateway.local:8080/...
    - host: ai-gateway.local
      http:
        paths: &gateway_paths
          - path: /ai/summarize
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
          - path: /ai/translate
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
          - path: /ai/moderate
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: ai-backend
                port:
                  number: 80
    # Same routes when you open http://localhost:8080/... (Host: localhost).
    # (Kubernetes Ingress cannot list 127.0.0.1 as host — use "localhost" in the URL, not the IP.)
    - host: localhost
      http:
        paths: *gateway_paths