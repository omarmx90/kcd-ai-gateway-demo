apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: ai-gateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
    spec:
      containers:
        - name: ai-backend
          image: ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            - name: MODEL_CHEAP
              value: "llama3"
            - name: MODEL_SMART
              value: "llama3"
            - name: PROVIDER
              value: "ollama"
            - name: OPENAI_MODEL_CHEAP
              value: "gpt-4o-mini"
            - name: OPENAI_MODEL_SMART
              value: "gpt-4o"
            - name: GEMINI_MODEL_CHEAP
              value: "gemini-2.0-flash"
            - name: GEMINI_MODEL_SMART
              value: "gemini-1.5-pro"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-llm-credentials
                  key: openai-api-key
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-llm-credentials
                  key: google-api-key
                  optional: true
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "700m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
